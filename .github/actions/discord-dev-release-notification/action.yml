name: 'Notify Discord of build status'
description: 'Send release status notification to Discord for dev/stable releases'
inputs:
    webhook:
        description: 'The Discord webhook URL.'
        required: true
    version:
        description: 'The version of the release.'
        required: true
    is-dev:
        description: 'Whether the release is a development release.'
        required: false
        default: 'false'
    changelog-url:
        description: 'The URL to the development changelog.'
        required: false
        default: ''

runs:
    using: 'composite'
    steps:
        -   name: Notify Discord of build status (Dev)
            if: ${{ inputs.is-dev == 'true' }}
            uses: sarisia/actions-status-discord@v1
            with:
                webhook: ${{ inputs.webhook }}
                nodetail: true
                title: "A new Reaparr development version has been released!"
                color: 0xFF8C00 # Amber / Dev
                description: |
                    A new **development** version `${{ inputs.version }}` of Reaparr is now available!
                    [Development changelog](${{ inputs.changelog-url }})
                    🐳 [Docker Hub](https://hub.docker.com/repository/docker/reaparr/reaparr/tags) — pull the `dev` tag
                    🖥️ [Desktop installers](https://github.com/Reaparr/Reaparr/releases/tag/v${{ inputs.version }}) — GitHub Releases
                username: Reaparr
                url: ${{ inputs.changelog-url }}
                avatar_url: "https://raw.githubusercontent.com/Reaparr/Reaparr/refs/heads/dev/export/reaparr/logo/reaparr-full-1024.png"

        -   name: Notify Discord of build status (Stable)
            if: ${{ inputs.is-dev != 'true' }}
            uses: sarisia/actions-status-discord@v1
            with:
                webhook: ${{ inputs.webhook }}
                nodetail: true
                title: "A new stable Reaparr version has been released!"
                color: 0xff0000 # Red / Stable
                description: |
                    A new **stable** version `${{ inputs.version }}` of Reaparr is now available!
                    [Release changelog](${{ inputs.changelog-url }})
                    🐳 [Docker Hub](https://hub.docker.com/repository/docker/reaparr/reaparr/tags) — pull the `latest` tag
                    🖥️ [Desktop installers](https://github.com/Reaparr/Reaparr/releases/tag/v${{ inputs.version }}) — GitHub Releases
                username: Reaparr
                url: ${{ inputs.changelog-url }}
                avatar_url: "https://raw.githubusercontent.com/Reaparr/Reaparr/refs/heads/dev/export/reaparr/logo/reaparr-full-1024.png"
