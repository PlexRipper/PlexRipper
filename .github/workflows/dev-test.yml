name: Execute Tests

on:
    workflow_dispatch:
    pull_request:
        branches: [ dev ]
        paths-ignore:
            - '.github/**'
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - 'README.md'

jobs:
    # Front-End-Type-Check:
    Front-End-Type-Check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Typescript type check
                run: bun run typecheck
                working-directory: src/WebAPI/ClientApp/
    # Front-End-Unit-Tests:
    Front-End-Unit-Tests:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Vitest tests
                run: bun run test
                working-directory: src/WebAPI/ClientApp/
    Front-End-Eslint-Check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run eslint check
                run: bun run lint
                working-directory: src/WebAPI/ClientApp/
    Front-End-Integration-Tests:
        defaults:
            run:
                working-directory: src/WebAPI/ClientApp/
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false # https://github.com/cypress-io/github-action/issues/48
            matrix:
                containers: [ 1, 2 ] # Uses 2 parallel instances
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Cypress tests
                uses: cypress-io/github-action@v6
                with:
                    wait-on: 'http://localhost:3030'
                    build: bun run build
                    start: bun run cypress:ci
                    command: bun run cypress:run
                    record: true
                    parallel: true
                    browser: chrome
                    working-directory: ./src/WebAPI/ClientApp/
                env:
                    CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    # Back-End Unit Tests
    Back-End-Unit-Tests:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4
            -   name: Dotnet Setup
                uses: ./.github/workflows/steps/dotnet-setup/
            -   name: Unit Tests
                run: dotnet test tests/UnitTests/UnitTests.sln --no-build --verbosity normal
    # Back-End Integration Tests
    Back-End-Integration-Tests:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4
            -   name: Dotnet Setup
                uses: ./.github/workflows/steps/dotnet-setup/
            -   name: Integration Tests with retry
                run: |
                    max_retries=2
                    count=0
                    success=false
                    while [ $count -lt $max_retries ]; do
                      echo "Running integration tests attempt $((count + 1)) of $max_retries"
                      dotnet test tests/IntegrationTests/IntegrationTests.sln --no-build --verbosity normal
                      if [ $? -eq 0 ]; then
                        success=true
                        break
                      fi
                      ((count++))
                      echo "Test failed. Retrying..."
                    done
                    
                    if [ "$success" = false ]; then
                      echo "Integration tests failed after $max_retries attempts"
                      exit 1
                    fi
    # Ensure the Docker image can be built without errors
    Test-Docker-Build:
        needs: [ Front-End-Unit-Tests, Front-End-Type-Check, Front-End-Eslint-Check, Back-End-Unit-Tests, Back-End-Integration-Tests ]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build
                uses: docker/build-push-action@v6
                env:
                    VERSION: 0.0.0
                    INFORMATIONAL_VERSION: 0.0.0
                with:
                    platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
                    push: false
                    build-args: |
                        VERSION=0.0.0
                        INFORMATIONAL_VERSION=0.0.0
                    file: docker/Dockerfile

