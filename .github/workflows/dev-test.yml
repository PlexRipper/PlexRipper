name: Execute Tests

on:
    workflow_dispatch:
    pull_request:
        branches: [ dev ]
        types: [ opened, ready_for_review, reopened, synchronize ]
        paths-ignore:
            - '.ai/**'
            - '.agents/**'
            - '.claude/**'
            - '.cursor/**'
            - '.idea/**'
            - '.junie/**'
            - '.opencode/**'
            - '.skillshare/**'
            - '.slopwatch/**'
            - '.run/**'
            - '.vscode/**'
            - 'README.md'

concurrency:
    group: dev-test-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Check if PR is in draft
    Check-PR-Status:
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false
        steps:
            -   run: echo "PR is not in draft, proceeding with tests"

    Actionlint:
        needs: [ Check-PR-Status, Check-Github-Changes ]
        if: needs.Check-Github-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Run actionlint
                uses: raven-actions/actionlint@v2.1.2
                with:
                    fail-on-error: true
                    matcher: true
                    shellcheck: true
                    pyflakes: true

    # Check if .github workflows/actions have changed
    Check-Github-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.github }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if .github has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    filters: |
                        github:
                            - '.github/**'

    # Check if front-end has changed
    Check-Frontend-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.frontend }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    filters: |
                        frontend:
                            - 'src/AppHost/ClientApp/**'

    # Check if back-end has changed
    Check-Backend-Changes:
        needs: [ Check-PR-Status ]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.backend }}
            unit_projects: ${{ steps.discover_tests.outputs.unit_projects }}
            integration_projects: ${{ steps.discover_tests.outputs.integration_projects }}
            target_framework: ${{ steps.discover_tests.outputs.target_framework }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if back-end has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    predicate-quantifier: 'every'
                    filters: |
                        backend:
                            - '{src/**,tests/**}'
                            - '!src/AppHost/ClientApp/**'

            -   name: Discover backend test projects
                id: discover_tests
                shell: bash
                run: |
                    set -euo pipefail
                    unit_projects=$(find tests/UnitTests -type f -name '*.csproj' -print | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
                    integration_projects=$(find tests/IntegrationTests -type f -name '*.csproj' -print | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
                    target_framework=$(sed -nE 's|.*<TargetFramework>([^<]+)</TargetFramework>.*|\1|p' Directory.Build.props | sed -n '1p')

                    if [[ "$unit_projects" == '[]' || "$integration_projects" == '[]' || -z "$target_framework" ]]; then
                        echo "Backend test project discovery returned incomplete results" >&2
                        exit 1
                    fi

                    {
                        echo "unit_projects=$unit_projects"
                        echo "integration_projects=$integration_projects"
                        echo "target_framework=$target_framework"
                    } >> "$GITHUB_OUTPUT"

    # Front-End-Type-Check:
    Front-End-Type-Check:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Typescript type check
                run: bun run typecheck
                working-directory: src/AppHost/ClientApp/

    # Front-End-Unit-Tests:
    Front-End-Unit-Tests:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Vitest tests
                run: bun run unit-test
                working-directory: src/AppHost/ClientApp/
            -   name: Upload test results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: frontend-test-results
                    path: src/AppHost/ClientApp/test-results
                    retention-days: 7

    Front-End-Eslint-Check:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run eslint check
                run: bun run lint
                working-directory: src/AppHost/ClientApp/

    Front-End-Integration-Tests:
        needs: [ Check-Frontend-Changes, Check-PR-Status ]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        strategy:
            # https://github.com/cypress-io/github-action/issues/48
            fail-fast: false
            matrix:
                containers: [ 1, 2 ] # Uses 2 parallel instances
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Cache Cypress binary
                uses: actions/cache@v4
                with:
                    path: ~/.cache/Cypress
                    key: ${{ runner.os }}-cypress-${{ hashFiles('**/package.json') }}
                    restore-keys: ${{ runner.os }}-cypress-
            -   name: Run Cypress tests
                uses: cypress-io/github-action@v6
                with:
                    install: false
                    record: true
                    browser: chrome
                    start: bun run static-server
                    parallel: true
                    working-directory: ./src/AppHost/ClientApp/
                    wait-on: 'http://localhost:${{ env.PORT }}'
                env:
                    CYPRESS_NODE_ENV: development
                    CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
                    PORT: 3035
                    CYPRESS_WEB_PORT: 3035
                    CYPRESS_API_PORT: 3035
                    CYPRESS_RETRIES: 2

    # Back-End Unit Tests
    Back-End-Build:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup (Restore only)
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: Reaparr.sln
                    restore: true
                    build: false

            -   name: Build Backend Solution
                run: dotnet build Reaparr.sln --no-restore

    Back-End-Unit-Tests:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        name: Back-End-Unit-Tests (${{ matrix.project }})
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(needs.Check-Backend-Changes.outputs.unit_projects) }}

        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Resolve test project metadata
                id: test_project
                shell: bash
                env:
                    TEST_PROJECT: ${{ matrix.project }}
                run: |
                    project_name=${TEST_PROJECT##*/}
                    project_name=${project_name%.csproj}
                    project_directory=${TEST_PROJECT%/*}
                    assembly_name=$(sed -nE 's|.*<AssemblyName>([^<]+)</AssemblyName>.*|\1|p' "$TEST_PROJECT" | sed -n '1p')
                    assembly_name=${assembly_name:-$project_name}
                    {
                        echo "name=$project_name"
                        echo "executable=$project_directory/bin/Debug/${{ needs.Check-Backend-Changes.outputs.target_framework }}/$assembly_name"
                    } >> "$GITHUB_OUTPUT"

            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.project }}
                    restore: true
                    build: true

            -   name: Run Unit Tests
                env:
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: >-
                    ./${{ steps.test_project.outputs.executable }}
                    --output Normal
                    --results-directory TestResults/${{ steps.test_project.outputs.name }}
                    --report-trx
                    --report-trx-filename test_results.trx
                    --coverage
                    --coverage-output-format cobertura
                    --coverage-output coverage.cobertura.xml

            -   name: Upload Test Outputs
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: backend-test-output-${{ steps.test_project.outputs.name }}
                    path: TestResults/${{ steps.test_project.outputs.name }}
                    retention-days: 7

    # Back-End Integration Tests
    Back-End-Integration-Tests:
        needs: [ Check-Backend-Changes, Check-PR-Status ]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        name: Back-End-Integration-Tests (${{ matrix.project }})
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(needs.Check-Backend-Changes.outputs.integration_projects) }}

        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Resolve test project metadata
                id: test_project
                shell: bash
                env:
                    TEST_PROJECT: ${{ matrix.project }}
                run: |
                    project_name=${TEST_PROJECT##*/}
                    project_name=${project_name%.csproj}
                    project_directory=${TEST_PROJECT%/*}
                    assembly_name=$(sed -nE 's|.*<AssemblyName>([^<]+)</AssemblyName>.*|\1|p' "$TEST_PROJECT" | sed -n '1p')
                    assembly_name=${assembly_name:-$project_name}
                    {
                        echo "name=$project_name"
                        echo "executable=$project_directory/bin/Debug/${{ needs.Check-Backend-Changes.outputs.target_framework }}/$assembly_name"
                    } >> "$GITHUB_OUTPUT"

            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.project }}
                    restore: true
                    build: true

            -   name: Run Integration Tests
                env:
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: >-
                    ./${{ steps.test_project.outputs.executable }}
                    --output Normal
                    --results-directory TestResults/${{ steps.test_project.outputs.name }}
                    --report-trx
                    --report-trx-filename test_results.trx
                    --coverage
                    --coverage-output-format cobertura
                    --coverage-output coverage.cobertura.xml

            -   name: Upload Integration Test Outputs
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: backend-test-output-${{ steps.test_project.outputs.name }}
                    path: TestResults/${{ steps.test_project.outputs.name }}
                    retention-days: 7

    # Code Coverage Report
    Code-Coverage-Report:
        needs: [ Back-End-Unit-Tests, Back-End-Integration-Tests, Check-PR-Status ]
        if: always() && (needs.Back-End-Unit-Tests.result != 'skipped' || needs.Back-End-Integration-Tests.result != 'skipped') && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Download Coverage Reports
                uses: actions/download-artifact@v4
                with:
                    pattern: backend-test-output-*
                    path: coverage-reports

            -   name: Generate Code Coverage Report
                uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
                with:
                    reports: 'coverage-reports/**/coverage.cobertura.xml'
                    targetdir: 'coveragereport'
                    reporttypes: 'HtmlInline;Cobertura;Badges'

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v4
                with:
                    name: code-coverage-report
                    path: coveragereport
                    retention-days: 7

    # Ensure Docker images can be built without errors (both amd64 and arm64)
    Test-Docker-Build:
        needs: [ Check-Frontend-Changes, Check-Backend-Changes, Back-End-Build, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status ]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/docker-build-multiarch.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev

    # Ensure desktop installers can be built without errors (Windows/Linux/macOS)
    Test-Desktop-Build:
        needs: [ Check-Frontend-Changes, Check-Backend-Changes, Back-End-Build, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status ]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/desktop-build.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev
            velopack_channel: dev
