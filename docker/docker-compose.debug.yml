version: '3.4'
services:
    plexripper:
        container_name: PlexRipper
        image: plexripper/plexripper:dev
        build:
            context: .
            dockerfile: ./Dockerfile
        ports:
            # Web UI & Web API
            - '7000:7000'
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - LOG_LEVEL=DEBUG # Set the logging level in the docker logging
            - LOG_ENV_VARS=false # Enable Log dump of all available ENV variables on PlexRipper startup
            - UNMASKED=false # Unmask sensitive data in logs if true
        volumes:
           # The paths /mnt/TURBO/PlexRipperDockerCache/ are examples, and you will need valid paths on your device with write permission.
            - /mnt/TURBO/PlexRipperDockerCache/Config:/Config
            - /mnt/TURBO/PlexRipperDockerCache/Downloads:/Downloads
            - /mnt/TURBO/PlexRipperDockerCache/Movies:/Movies
            - /mnt/TURBO/PlexRipperDockerCache/TvShows:/TvShows
