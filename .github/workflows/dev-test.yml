name: Execute Tests

on:
    workflow_dispatch:
    pull_request:
        branches: [ dev ]
        types: [opened, ready_for_review, reopened, synchronize]
        paths-ignore:
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - 'README.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Check if PR is in draft
    Check-PR-Status:
        runs-on: ubuntu-latest
        if: github.event.pull_request.draft == false
        steps:
            - run: echo "PR is not in draft, proceeding with tests"

    Actionlint:
        needs: [Check-PR-Status, Check-Github-Changes]
        if: needs.Check-Github-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Run actionlint
                uses: raven-actions/actionlint@v2.1.2
                with:
                    fail-on-error: true
                    matcher: true
                    shellcheck: true
                    pyflakes: true

    # Check if .github workflows/actions have changed
    Check-Github-Changes:
        needs: [Check-PR-Status]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.github }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if .github has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    filters: |
                        github:
                            - '.github/**'

    # Check if front-end has changed
    Check-Frontend-Changes:
        needs: [Check-PR-Status]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.frontend }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    filters: |
                        frontend:
                            - 'src/AppHost/ClientApp/**'

    # Check if back-end has changed
    Check-Backend-Changes:
        needs: [Check-PR-Status]
        if: always() && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check_changes.outputs.backend }}
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if back-end has changed
                id: check_changes
                uses: dorny/paths-filter@v3
                with:
                    filters: |
                        backend:
                            - 'src/**'
                            - '!src/AppHost/ClientApp/**'
                            - 'tests/**'

    # Front-End-Type-Check:
    Front-End-Type-Check:
        needs: [Check-Frontend-Changes, Check-PR-Status]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Typescript type check
                run: bun run typecheck
                working-directory: src/AppHost/ClientApp/

    # Front-End-Unit-Tests:
    Front-End-Unit-Tests:
        needs: [Check-Frontend-Changes, Check-PR-Status]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run Vitest tests
                run: bun run unit-test
                working-directory: src/AppHost/ClientApp/
            -   name: Upload test results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: frontend-test-results
                    path: src/AppHost/ClientApp/test-results
                    retention-days: 7

    Front-End-Eslint-Check:
        needs: [Check-Frontend-Changes, Check-PR-Status]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Run eslint check
                run: bun run lint
                working-directory: src/AppHost/ClientApp/

    Front-End-Integration-Tests:
        needs: [Check-Frontend-Changes, Check-PR-Status]
        if: needs.Check-Frontend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        strategy:
            # https://github.com/cypress-io/github-action/issues/48
            fail-fast: false
            matrix:
                containers: [ 1, 2 ] # Uses 2 parallel instances
        steps:
            -   uses: actions/checkout@v4
            -   name: Client App Install
                uses: ./.github/actions/client-app-install/
            -   name: Cache Cypress binary
                uses: actions/cache@v4
                with:
                    path: ~/.cache/Cypress
                    key: ${{ runner.os }}-cypress-${{ hashFiles('**/package.json') }}
                    restore-keys: ${{ runner.os }}-cypress-
            -   name: Run Cypress tests
                uses: cypress-io/github-action@v6
                with:
                    install: false
                    record: true
                    browser: firefox
                    start: bun run static-server
                    parallel: true
                    working-directory: ./src/AppHost/ClientApp/
                    wait-on: 'http://localhost:${{ env.PORT }}'
                env:
                    CYPRESS_NODE_ENV: development
                    CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
                    PORT: 3035
                    CYPRESS_WEB_PORT: 3035
                    CYPRESS_API_PORT: 3035
                    CYPRESS_RETRIES: 2

    # Back-End Unit Tests
    Back-End-Build:
        needs: [Check-Backend-Changes, Check-PR-Status]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup (Restore only)
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: Reaparr.sln
                    restore: true
                    build: false

            -   name: Build Backend Solution
                run: dotnet build Reaparr.sln --no-restore

            -   name: Package Build Outputs
                shell: bash
                run: >-
                    find src tests -type d -path '*/bin/Debug/net10.0' -print0 |
                    tar --create --file backend-build.tar --null --files-from -

            -   name: Upload Build Outputs
                uses: actions/upload-artifact@v4
                with:
                    name: backend-build
                    path: backend-build.tar
                    retention-days: 1

    Back-End-Unit-Tests:
        needs: [Check-Backend-Changes, Check-PR-Status, Back-End-Build]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        name: Back-End-Unit-Tests (${{ matrix.project_name }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - test_project: tests/UnitTests/AppHost.UnitTests/AppHost.UnitTests.csproj
                      project_name: AppHost.UnitTests
                    - test_project: tests/UnitTests/Application.UnitTests/Application.UnitTests.csproj
                      project_name: Application.UnitTests
                    - test_project: tests/UnitTests/BackgroundJobs.UnitTests/BackgroundJobs.UnitTests.csproj
                      project_name: BackgroundJobs.UnitTests
                    - test_project: tests/UnitTests/BaseTests.UnitTests/BaseTests.UnitTests.csproj
                      project_name: BaseTests.UnitTests
                    - test_project: tests/UnitTests/Data.UnitTests/Data.UnitTests.csproj
                      project_name: Data.UnitTests
                    - test_project: tests/UnitTests/Domain.UnitTests/Domain.UnitTests.csproj
                      project_name: Domain.UnitTests
                    - test_project: tests/UnitTests/External.UnitTests/External.UnitTests.csproj
                      project_name: External.UnitTests
                    - test_project: tests/UnitTests/FileSystem.UnitTests/FileSystem.UnitTests.csproj
                      project_name: Environment.UnitTests
                    - test_project: tests/UnitTests/Environment.UnitTests/Environment.UnitTests.csproj
                      project_name: FileSystem.UnitTests
                    - test_project: tests/UnitTests/FluentResultExtension.UnitTests/FluentResultExtension.UnitTests.csproj
                      project_name: FluentResultExtension.UnitTests
                    - test_project: tests/UnitTests/Logging.UnitTests/Logging.UnitTests.csproj
                      project_name: Logging.UnitTests
                    - test_project: tests/UnitTests/PlexApi.UnitTests/PlexApi.UnitTests.csproj
                      project_name: PlexApi.UnitTests
                    - test_project: tests/UnitTests/PublicApi.UnitTests/PublicApi.UnitTests.csproj
                      project_name: PublicApi.UnitTests
                    - test_project: tests/UnitTests/Settings.UnitTests/Settings.UnitTests.csproj
                      project_name: Settings.UnitTests

        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.test_project }}
                    restore: false
                    build: false

            -   name: Download Build Outputs
                uses: actions/download-artifact@v4
                with:
                    name: backend-build
                    path: .

            -   name: Extract Build Outputs
                run: tar -xf backend-build.tar

            -   name: Run Unit Tests
                env:
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: >-
                    dotnet run --project ${{ matrix.test_project }} --no-build --no-restore --
                    --output Normal
                    --results-directory TestResults/${{ matrix.project_name }}
                    --report-trx
                    --report-trx-filename test_results.trx
                    --coverage
                    --coverage-output-format cobertura
                    --coverage-output coverage.cobertura.xml

            -   name: Sanitize Artifact Name
                id: sanitize
                run: |
                    FILENAME=$(basename "${{ matrix.test_project }}" .csproj)
                    echo "safe_name=$FILENAME" >> $GITHUB_OUTPUT

            -   name: Upload Test Results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-results-${{ steps.sanitize.outputs.safe_name }}
                    path: TestResults/${{ matrix.project_name }}/test_results.trx
                    retention-days: 7

            -   name: Upload Code Coverage
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: code-coverage-${{ steps.sanitize.outputs.safe_name }}
                    path: TestResults/${{ matrix.project_name }}/coverage.cobertura.xml
                    retention-days: 7

    # Back-End Integration Tests
    Back-End-Integration-Tests:
        needs: [Check-Backend-Changes, Check-PR-Status, Back-End-Build]
        if: needs.Check-Backend-Changes.outputs.should_run == 'true' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                integration_test_project:
                    - tests/IntegrationTests/IntegrationTests/IntegrationTests.csproj
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: ${{ matrix.integration_test_project }}
                    restore: false
                    build: false

            -   name: Download Build Outputs
                uses: actions/download-artifact@v4
                with:
                    name: backend-build
                    path: .

            -   name: Extract Build Outputs
                run: tar -xf backend-build.tar

            -   name: Run Integration Tests
                env:
                    TUNIT_GITHUB_REPORTER_STYLE: collapsible
                run: >-
                    dotnet run --project ${{ matrix.integration_test_project }} --no-build --no-restore --
                    --output Normal
                    --results-directory TestResults/IntegrationTests
                    --report-trx
                    --report-trx-filename integration_test_results.trx

            -   name: Upload Integration Test Results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: integration-test-results
                    path: TestResults/IntegrationTests/integration_test_results.trx
                    retention-days: 7

    # Code Coverage Report
    Code-Coverage-Report:
        needs: [Back-End-Unit-Tests, Check-PR-Status]
        if: always() && needs.Back-End-Unit-Tests.result != 'skipped' && (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Download Coverage Reports
                uses: actions/download-artifact@v4
                with:
                    pattern: code-coverage-*
                    merge-multiple: true
                    path: coverage-reports

            -   name: Generate Code Coverage Report
                uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
                with:
                    reports: 'coverage-reports/**/coverage.cobertura.xml'
                    targetdir: 'coveragereport'
                    reporttypes: 'HtmlInline;Cobertura;Badges'

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v4
                with:
                    name: code-coverage-report
                    path: coveragereport
                    retention-days: 7

    # Ensure Docker images can be built without errors (both amd64 and arm64)
    Test-Docker-Build:
        needs: [Check-Frontend-Changes, Check-Backend-Changes, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/docker-build-multiarch.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev

    # Ensure desktop installers can be built without errors (Windows/Linux/macOS)
    Test-Desktop-Build:
        needs: [Check-Frontend-Changes, Check-Backend-Changes, Back-End-Unit-Tests, Back-End-Integration-Tests, Front-End-Type-Check, Front-End-Unit-Tests, Front-End-Eslint-Check, Front-End-Integration-Tests, Actionlint, Check-PR-Status]
        if: |
            always() &&
            (needs.Check-PR-Status.result == 'success' || github.event_name == 'workflow_dispatch') &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled')
        uses: ./.github/workflows/desktop-build.yml
        with:
            push: false
            version: 9.9.9
            informational_version: 9.9.9-dev
