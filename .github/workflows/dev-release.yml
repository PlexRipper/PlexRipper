name: Create Reaparr Dev Container Release

on:
    workflow_dispatch:
    push:
        branches:
            - dev
        paths-ignore:
            # - '.github/**'
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - 'release.config.mjs'
            - 'README.md'

concurrency:
    group: dev-release
    cancel-in-progress: false

jobs:
    # Semantic Release for Dev Prereleases
    semantic-release:
        name: Semantic Release (DEV Release)
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4
                with:
                    token: ${{ secrets.GH_TOKEN }}
                    fetch-depth: 0
                    ref: dev

            -   name: Verify Git State
                run: |
                    echo "Current branch: $(git branch --show-current)"
                    echo "Remote branches:"
                    git branch -r
                    echo "Git remote:"
                    git remote -v

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 21

            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/

            -   name: Debug Config
                run: |
                    echo "Working directory: $(pwd)"
                    echo "Config file exists:"
                    ls -la release.config.mjs || echo "NOT FOUND in root"
                    echo "---"
                    echo "Config content:"
                    cat release.config.mjs || echo "Could not read config"
                    echo "---"
                    echo "STABLE_RELEASE env: '$STABLE_RELEASE'"

            -   name: Run Semantic Release (DEV Release)
                id: semantic-release
                run: npx --prefix src/AppHost/ClientApp/ semantic-release --debug
                env:
                    # STABLE_RELEASE not set = appends -dev.N suffix to computed version
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}

            -   name: Log Release Info
                run: |
                    echo "::notice::Release published: ${{ steps.semantic-release.outputs.new-release-published }}"
                    echo "::notice::Version: ${{ steps.semantic-release.outputs.new-release-version }}"
        outputs:
            new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
            new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
            new-release-notes: ${{ steps.semantic-release.outputs.new-release-notes }}

    # Build and publish multi-arch Docker images
    build-and-publish:
        name: Build and Publish Docker Images
        needs: [semantic-release]
        if: needs.semantic-release.outputs.new-release-published == 'true'
        uses: ./.github/workflows/docker-build-multiarch.yml
        secrets: inherit
        with:
            push: true
            version: ${{ needs.semantic-release.outputs.new-release-version }}
            informational_version: ${{ needs.semantic-release.outputs.new-release-version }}
            tags: "dev"

    # Notifications (depends on build-and-publish)
    notify-discord:
        name: Notify Discord
        needs: [semantic-release, build-and-publish]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4

            -   name: Notify Discord of Dev Release
                uses: ./.github/workflows/steps/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    is-dev: true
                    changelog-url: 'https://github.com/Reaparr/Reaparr/releases/tag/v${{ needs.semantic-release.outputs.new-release-version }}'

            -   name: Post Changelog to Discord
                uses: ./.github/workflows/steps/discord-changelog-notification/
                with:
                    webhook: ${{ secrets.DISCORD_CHANGELOG_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    changelog: ${{ needs.semantic-release.outputs.new-release-notes }}
                    is-dev: true
