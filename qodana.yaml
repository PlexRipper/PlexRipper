version: '1.0'

linter: qodana-cdnet
withinDocker: true

dotnet:
    solution: Reaparr.sln

profile:
    name: qodana.recommended

exclude:
    -   name: RedundantUsingDirective.Global
    -   name: All
        paths:
            - "file:**/*.DotSettings"
            - "file:src/Data/Migrations/*.cs"
            - "file:**/bin/**"
            - "file:**/obj/**"
            - "file:**/*.g.cs"
            - "file:**/*.g.i.cs"
            - "file:**/.editorconfig"
            - "file:**/*.globalconfig"
            - "file:**/*.AssemblyInfo.cs"
            - "file:**/AssemblyInfo.cs"
            - "file:**/*.json"
            - "file:**/node_modules/**"
            - "file:**/.nuxt/**"
            - "file:**/.output/**"
            - "file:**/.nitro/**"
            - "file:**/dist/**"
            - "file:**/coverage/**"
            - "file:**/.cache/**"
            - "file:**/.eslintcache"
            - "file:**/cypress/videos/**"
            - "file:**/cypress/screenshots/**"
            - "file:**/tsconfig.tsbuildinfo"
            - "file:**/TestResults/**"
            - "file:**/test-results/**"
            - "file:**/.test-artifacts/**"
            - "file:**/.artifacts/**"
            - "file:**/.playwright-mcp/**"
            - "file:**/.idea/**"
            - "file:**/.vs/**"
            - "file:**/.agentbridge/**"
            - "file:**/.agent-work/**"
            - "file:**/.codex/**"
            - "file:**/.pi-subagents/**"
            - src/AppHost/ClientApp/src/types/api/generated
    -   name: ArrangeTrailingCommaInMultilineLists
    -   name: SuggestDiscardDeclarationVarStyle
    -   name: XmlHighlighting
    -   name: ExplicitCallerInfoArgument

fixesStrategy: none
