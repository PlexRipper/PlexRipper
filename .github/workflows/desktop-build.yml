name: Desktop Build

# Reusable workflow that builds native installers for Windows, Linux, and macOS via Velopack.
# Can be called with push=true (for releases) or push=false (for testing the build).

on:
    workflow_call:
        inputs:
            version:
                description: 'Release version (e.g. 1.2.3)'
                required: true
                type: string
            informational_version:
                description: 'Informational version (e.g. 1.2.3-dev.1)'
                required: true
                type: string
            push:
                description: 'Upload installers to the GitHub Release'
                required: false
                type: boolean
                default: false
            publish_release:
                description: 'Publish/finalize the GitHub Release while uploading desktop assets'
                required: false
                type: boolean
                default: false
            velopack_channel:
                description: 'Velopack update channel (dev or stable)'
                required: true
                type: string

jobs:
    prepare-frontend:
        name: Prepare frontend assets
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4

            -   name: Client App Install
                uses: ./.github/actions/client-app-install/

            -   name: Generate frontend
                shell: bash
                working-directory: src/AppHost/ClientApp/
                run: bun run generate --fail-on-error

            -   name: Upload generated frontend artifact
                uses: actions/upload-artifact@v4
                with:
                    name: frontend-public
                    path: src/AppHost/ClientApp/.output/public
                    retention-days: 1

    build:
        name: Build ${{ matrix.rid }}
        needs: [ prepare-frontend ]
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   rid: win-x64
                        runner: windows-latest
                    -   rid: win-arm64
                        runner: windows-11-arm
                    -   rid: linux-x64
                        runner: ubuntu-latest
                    -   rid: linux-arm64
                        runner: ubuntu-24.04-arm
                    -   rid: osx-x64
                        runner: macos-15-intel
                    -   rid: osx-arm64
                        runner: macos-15

        runs-on: ${{ matrix.runner }}
        permissions:
            contents: write

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4

            -   name: Download generated frontend artifact
                uses: actions/download-artifact@v4
                with:
                    name: frontend-public
                    path: .tmp/frontend-public

            -   name: Dotnet Setup (Restore only)
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: src/AppHost/AppHost.csproj
                    restore: true
                    build: false
                    # No --locked-mode: the lock file targets the framework-dependent Docker build.
                    # Self-contained desktop builds need RID-specific native packages.
                    locked-mode: false
                    runtime: ${{ matrix.rid }}

            -   name: Setup .NET 9 runtime for vpk
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: 9.0.x

            -   name: Install Velopack CLI
                shell: bash
                run: dotnet tool install -g vpk

            -   name: Download previous release (for delta packages)
                if: inputs.push
                shell: bash
                run: |
                    mkdir -p Releases
                    vpk download github \
                        --repoUrl https://github.com/${{ github.repository }} \
                        --channel ${{ inputs.velopack_channel }} \
                        --token ${{ secrets.GITHUB_TOKEN }}

            -   name: Package installer via shared CLI
                shell: bash
                run: |
                    dotnet run --project tools/Build -- desktop ci-package \
                        --rid ${{ matrix.rid }} \
                        --version ${{ inputs.version }} \
                        --informational-version ${{ inputs.informational_version }} \
                        --channel ${{ inputs.velopack_channel }} \
                        --frontend-public-dir .tmp/frontend-public \
                        --artifact-dir Releases \
                        --preserve-existing-artifacts

            -   name: Upload packed installer artifact
                if: inputs.push
                uses: actions/upload-artifact@v4
                with:
                    name: desktop-${{ matrix.rid }}
                    path: Releases/
                    retention-days: 1

    upload-release:
        name: Upload ${{ matrix.rid }} to GitHub Release
        needs: [ build ]
        if: inputs.push
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                include:
                    -   rid: win-x64
                    -   rid: win-arm64
                    -   rid: linux-x64
                    -   rid: linux-arm64
                    -   rid: osx-x64
                    -   rid: osx-arm64

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4

            -   name: Setup .NET 9 runtime for vpk
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: 9.0.x

            -   name: Install Velopack CLI
                run: dotnet tool install -g vpk

            -   name: Download packed installer
                uses: actions/download-artifact@v4
                with:
                    name: desktop-${{ matrix.rid }}
                    path: Releases/${{ matrix.rid }}

            -   name: Upload installer to GitHub Release
                shell: bash
                run: |
                    vpk upload github \
                        --repoUrl https://github.com/${{ github.repository }} \
                        ${{ inputs.publish_release && '--publish' || '' }} \
                        --merge \
                        --channel ${{ inputs.velopack_channel }} \
                        --outputDir Releases/${{ matrix.rid }} \
                        --releaseName "Reaparr ${{ inputs.version }}" \
                        --tag v${{ inputs.version }} \
                        --token ${{ secrets.GITHUB_TOKEN }}
