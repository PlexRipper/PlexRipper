name: Qodana Full Analysis

on:
    workflow_dispatch:
    push:
        branches: [ dev ]

permissions:
    contents: read

concurrency:
    group: qodana-full-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Qodana:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    persist-credentials: false
            -   name: Prepare backend solution
                uses: ./.github/actions/dotnet-setup/
                with:
                    project-path: Reaparr.sln
                    build: false
            -   name: Qodana Scan
                uses: JetBrains/qodana-action@v2026.2
                with:
                    pr-mode: false
                    post-pr-comment: false
                    push-fixes: none
                    args: --no-build
                    upload-result: true
                env:
                    QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
                    QODANA_ENDPOINT: 'https://qodana.cloud'
