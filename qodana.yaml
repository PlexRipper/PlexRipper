version: '1.0'

linter: qodana-cdnet
withinDocker: true

dotnet:
    solution: Reaparr.sln

profile:
    name: qodana.recommended

exclude:
    -   name: RedundantUsingDirective.Global
    -   name: All
        paths:
            - "**/*.DotSettings"
            - "src/Data/Migrations/*.cs"
            - "**/bin/**"
            - "**/obj/**"
            - "**/*.g.cs"
            - "**/*.g.i.cs"
            - ".editorconfig"
            - "**/.editorconfig"
            - "**/*.globalconfig"
            - "**/*.AssemblyInfo.cs"
            - "**/AssemblyInfo.cs"
            - "**/*.json"
            - "**/node_modules/**"
            - "**/.nuxt/**"
            - "**/.output/**"
            - "**/.nitro/**"
            - "**/dist/**"
            - "**/coverage/**"
            - "**/.cache/**"
            - "**/.eslintcache"
            - "**/cypress/videos/**"
            - "**/cypress/screenshots/**"
            - "**/tsconfig.tsbuildinfo"
            - "**/TestResults/**"
            - "**/test-results/**"
            - "**/.test-artifacts/**"
            - "**/.artifacts/**"
            - "**/.playwright-mcp/**"
            - "**/.idea/**"
            - "**/.vs/**"
            - "**/.agentbridge/**"
            - "**/.agent-work/**"
            - "**/.codex/**"
            - "**/.pi-subagents/**"
            - src/AppHost/ClientApp/src/types/api/generated
    -   name: ArrangeTrailingCommaInMultilineLists
    -   name: SuggestDiscardDeclarationVarStyle
    -   name: XmlHighlighting
    -   name: ExplicitCallerInfoArgument

fixesStrategy: none
