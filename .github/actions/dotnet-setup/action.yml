name: 'Dotnet Setup'
description: 'Setup .NET, restore dependencies and build'
inputs:
    project-path:
        description: 'Relative path to the project or solution to build'
        required: true
    restore:
        description: 'Whether to run dotnet restore'
        required: false
        default: 'true'
    build:
        description: 'Whether to run dotnet build'
        required: false
        default: 'true'
    locked-mode:
        description: 'Whether to pass --locked-mode to dotnet restore'
        required: false
        default: 'true'
    runtime:
        description: 'Target RID for restore (e.g. win-x64). Leave empty for framework-dependent builds.'
        required: false
        default: ''
runs:
    using: 'composite'
    steps:
        -   name: Setup .NET SDK
            uses: fast-actions/setup-dotnet@v1
            with:
                sdk-version: '10.x'

        -   name: Cache NuGet packages
            if: inputs.restore == 'true'
            uses: actions/cache@v6
            with:
                path: ~/.nuget/packages
                key: ${{ runner.os }}-nuget-${{ inputs.runtime != '' && format('{0}-', inputs.runtime) || '' }}${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
                restore-keys: |
                    ${{ runner.os }}-nuget-${{ inputs.runtime != '' && format('{0}-', inputs.runtime) || '' }}
                    ${{ runner.os }}-nuget-

        -   name: Restore dependencies
            if: inputs.restore == 'true'
            shell: bash
            env:
                LOCKED_MODE: ${{ inputs.locked-mode }}
                PROJECT_PATH: ${{ inputs.project-path }}
                RUNTIME: ${{ inputs.runtime }}
            run: |
                restore_args=(dotnet restore "$PROJECT_PATH")
                if [[ -n "$RUNTIME" ]]; then
                    restore_args+=(-r "$RUNTIME")
                fi
                if [[ "$LOCKED_MODE" == 'true' ]]; then
                    restore_args+=(--locked-mode)
                fi
                "${restore_args[@]}"

        -   name: Build
            if: inputs.build == 'true'
            shell: bash
            env:
                PROJECT_PATH: ${{ inputs.project-path }}
            run: dotnet build "$PROJECT_PATH" --no-restore
