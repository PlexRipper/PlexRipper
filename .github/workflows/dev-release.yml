name: Create PlexRipper Dev Container Release

on:
    workflow_dispatch:
    push:
        branches:
            - dev
        paths-ignore:
            - '.github/**'
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - '.releaserc.json'
            - 'README.md'

jobs:
    # Build And Release Docker Image
    build-and-publish:
        name: Build and Publish On Dev Tagged Docker Image
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4
                with:
                    token: ${{ secrets.GH_TOKEN }}
                    fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags

            -   name: Get latest version tag
                id: version
                uses: WyriHaximus/github-action-get-previous-tag@v1

            -   name: Echo last version tag
                run: echo ${{ steps.version.outputs.tag }}

            -   name: Strip 'v' from version
                id: strip_v
                run: |
                    # Strip the 'v' prefix from the version tag
                    VERSION_NO_V="${{ steps.version.outputs.tag }}"
                    VERSION_NO_V="${VERSION_NO_V#v}"
                    echo "VERSION_NO_V=$VERSION_NO_V" >> $GITHUB_ENV

            -   name: Append Dev Date
                id: append_date
                run: |
                    # Add the current date in YYYY-MM-DD format
                    DEV_DATE=$(date +%Y-%m-%d)
                    VERSION_WITH_DATE="${VERSION_NO_V}-dev-${DEV_DATE}"
                    echo "VERSION_WITH_DATE=$VERSION_WITH_DATE" >> $GITHUB_ENV

#            -   name: Set up Docker Buildx
#                uses: docker/setup-buildx-action@v3
#
#            -   name: Login to Docker Hub
#                uses: docker/login-action@v3
#                with:
#                    username: ${{ secrets.DOCKER_USERNAME }}
#                    password: ${{ secrets.DOCKER_PASSWORD }}
#
#            -   name: Build and push
#                uses: docker/build-push-action@v6
#                env:
#                    VERSION: ${{ env.VERSION_NO_V }}
#                    INFORMATIONAL_VERSION: ${{ env.VERSION_WITH_DATE }}
#                with:
#                    platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
#                    push: true
#                    tags: plexripper/plexripper:dev,plexripper/plexripper:${{ env.VERSION_WITH_DATE }}
#                    build-args: |
#                        VERSION=${{ env.VERSION_NO_V }}
#                        INFORMATIONAL_VERSION=${{ env.VERSION_WITH_DATE }}
#                    file: docker/Dockerfile

            -   name: Get latest commit SHA
                id: latest_commit
                run: |
                    # Get the latest commit SHA
                    LATEST_COMMIT=$(git rev-parse HEAD)
                    echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_ENV

            -   name: Get last stable release commit SHA
                id: last_stable_commit
                run: |
                    # Get the last stable tag and its commit SHA
                    LAST_TAG=$(git describe --tags --abbrev=0)
                    LAST_COMMIT_SHA=$(git rev-list -n 1 $LAST_TAG)
                    echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV
                    echo "LAST_COMMIT_SHA=$LAST_COMMIT_SHA" >> $GITHUB_ENV

            -   name: Generate GitHub comparison link
                id: comparison_link
                run: |
                    # Construct the comparison URL
                    COMPARISON_URL="https://github.com/PlexRipper/PlexRipper/compare/${{ env.LAST_COMMIT_SHA }}...${{ env.LATEST_COMMIT }}"
                    echo "COMPARISON_URL=$COMPARISON_URL" >> $GITHUB_ENV

            -   name: Generate Semantic Release Notes
                id: release_notes
                run: |
                    RELEASE_NOTES=$(npx --prefix src/WebAPI/ClientApp/ semantic-release --dry-run --no-ci --range "${{ env.LAST_COMMIT_SHA }}..${{ env.LATEST_COMMIT }}" | awk '/Release note:/ {flag=1; next} /^$/ {flag=0} flag')
                    echo "RELEASE_NOTES=$RELEASE_NOTES" >> $GITHUB_ENV

            -   name: Create or Update GitHub Pre-Release
                uses: actions/create-release@v1
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                    tag_name: "dev-latest"
                    release_name: "Development Release"
                    body: |
                        Automatically updated pre-release from the latest development branch.

                        ${{ env.RELEASE_NOTES }}
                    draft: false
                    prerelease: true

#            -   name: Notify Discord of Dev Release
#                uses: ./.github/workflows/steps/discord-dev-release-notification/
#                with:
#                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
#                    version: ${{ env.VERSION_WITH_DATE }}
#                    is-dev: true
#                    changelog-url: ${{ env.COMPARISON_URL }}
