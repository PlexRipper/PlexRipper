name: Test discord notification

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test-notification:
        name: Test discord notification
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Notify Discord of Dev Release
                uses: ./.github/actions/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: test-version
                    is-dev: true

            -   name: Notify Discord of Stable Release
                uses: ./.github/actions/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: test-version
                    is-dev: false
