name: Publish Docker latest and version tagged image
# This should only run when a release is created with a version tag
on:
    workflow_dispatch:

jobs:
    semantic-release:
        if: github.ref_name == github.event.repository.default_branch
        name: Semantic Release Process
        runs-on: ubuntu-latest
        permissions:
            contents: write # to be able to publish a GitHub release
            issues: write # to be able to comment on released issues
            pull-requests: write # to be able to comment on released pull requests
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4
                with:
                    token: ${{ secrets.GH_TOKEN }}
                    fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
            # This is required to be able to run semantic-release
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 21
            # This is required to be able to run semantic-release plugins
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: GitHub Release
                id: get-next-version
                run: npx --prefix src/AppHost/ClientApp/ semantic-release
                env:
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
                    GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
                    GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
                    GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
                    GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
        outputs:
            new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
            new-release-version: ${{ steps.get-next-version.outputs.new-release-version }}
            new-release-notes: ${{ steps.get-next-version.outputs.new-release-notes }}
    
    # Build Docker Image
    build-and-publish:
        if: needs.semantic-release.outputs.new-release-published == 'true'
        needs: [ semantic-release ]
        runs-on: ubuntu-latest
        name: Build and Publish On Latest / Tagged Docker Image
        steps:
            -   name: Checkout source code
                uses: actions/checkout@v4
                with:
                    token: ${{ secrets.GH_TOKEN }}

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Login to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            -   name: Docker meta
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: |
                        name=reaparr/reaparr
                    tags: |
                        type=semver,pattern={{version}},value=${{ needs.semantic-release.outputs.new-release-version }}

            -   name: Build and push
                uses: docker/build-push-action@v6
                env:
                    VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
                    INFORMATIONAL_VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
                with:
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    build-args: |
                        VERSION=${{ needs.semantic-release.outputs.new-release-version }}
                        INFORMATIONAL_VERSION=${{ needs.semantic-release.outputs.new-release-version }}
                    file: docker/Dockerfile

            -   name: Notify Discord of Stable Release
                uses: ./.github/workflows/steps/discord-dev-release-notification/
                with:
                    webhook: ${{ secrets.DISCORD_RELEASES_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    is-dev: false
                    changelog-url: "https://github.com/Reaparr/Reaparr/releases/tag/v${{ needs.semantic-release.outputs.new-release-version }}"

            -   name: Post Changelog to Discord
                uses: ./.github/workflows/steps/discord-changelog-notification/
                with:
                    webhook: ${{ secrets.DISCORD_CHANGELOG_CHANNEL_WEBHOOK }}
                    version: ${{ needs.semantic-release.outputs.new-release-version }}
                    changelog: ${{ needs.semantic-release.outputs.new-release-notes }}
                    is-dev: false
