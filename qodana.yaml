version: '1.0'

linter: qodana-dotnet
withinDocker: false

dotnet:
    solution: Reaparr.sln

profile:
    name: qodana.recommended

plugins:
    -   id: CyclomaticComplexity

include:
    -   name: CyclomaticComplexity

exclude:
    -   name: All
        paths:
            - src/AppHost/ClientApp/node_modules
            - src/AppHost/ClientApp/.nuxt
            - src/AppHost/ClientApp/.output
            - src/AppHost/ClientApp/src/types/api/generated

# The plugin's default complexity threshold is 20. Keep findings report-only
# until the full dev scan is reviewed and its baseline is committed to
# .qodana/baseline.sarif.json; do not automatically accept new findings as debt.
fixesStrategy: none
