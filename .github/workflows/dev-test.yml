name: Execute Tests

on:
    workflow_dispatch:
    pull_request:
        branches: [ dev ]
        paths-ignore:
            - '.github/**'
            - '.idea/**'
            - '.run/**'
            - '.vscode/**'
            - 'README.md'

jobs:
    # Front-End-Type-Check:
    Front-End-Type-Check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                uses: ./.github/workflows/steps/skip-if-no-frontend-change
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Typescript type check
                run: bun run typecheck
                working-directory: src/WebAPI/ClientApp/
    # Front-End-Unit-Tests:
    Front-End-Unit-Tests:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                uses: ./.github/workflows/steps/skip-if-no-frontend-change
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Vitest tests
                run: bun run test
                working-directory: src/WebAPI/ClientApp/
    Front-End-Eslint-Check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                uses: ./.github/workflows/steps/skip-if-no-frontend-change
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run eslint check
                run: bun run lint
                working-directory: src/WebAPI/ClientApp/
    Front-End-Integration-Tests:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   name: Check if front-end has changed
                uses: ./.github/workflows/steps/skip-if-no-frontend-change
            -   name: Client App Install
                uses: ./.github/workflows/steps/client-app-install/
            -   name: Run Cypress tests
                uses: cypress-io/github-action@v6
                with:
                    install: false
                    record: true
                    browser: firefox
                    start: bun run static-server
                    parallel: true
                    working-directory: ./src/WebAPI/ClientApp/
                    wait-on: 'http://localhost:${{ env.PORT }}'
                env:
                    CYPRESS_NODE_ENV: development
                    CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
                    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
                    PORT: 3035
                    CYPRESS_WEB_PORT: 3035
                    CYPRESS_API_PORT: 3035
                    CYPRESS_RETRIES: 2

    # Back-End Unit Tests
    Back-End-Unit-Tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                test_project:
                    - tests/UnitTests/Application.UnitTests/Application.UnitTests.csproj
                    - tests/UnitTests/Data.UnitTests/Data.UnitTests.csproj
                    - tests/UnitTests/Domain.UnitTests/Domain.UnitTests.csproj
                    - tests/UnitTests/FileSystem.UnitTests/FileSystem.UnitTests.csproj
                    - tests/UnitTests/FluentResultExtension.UnitTests/FluentResultExtension.UnitTests.csproj
                    - tests/UnitTests/Logging.UnitTests/Logging.UnitTests.csproj
                    - tests/UnitTests/PlexApi.UnitTests/PlexApi.UnitTests.csproj
                    - tests/UnitTests/Settings.UnitTests/Settings.UnitTests.csproj
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup
                uses: ./.github/workflows/steps/dotnet-setup/
                with:
                    project-path: ${{ matrix.test_project }}

            -   name: Run Unit Tests
                run: dotnet test ${{ matrix.test_project }} --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

            -   name: Sanitize Artifact Name
                id: sanitize
                run: |
                    FILENAME=$(basename "${{ matrix.test_project }}" .csproj)
                    echo "safe_name=$FILENAME" >> $GITHUB_OUTPUT

            -   name: Upload Test Results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-results-${{ steps.sanitize.outputs.safe_name }}
                    path: '**/TestResults/*.trx'


            -   name: Publish Test Report
                if: always()
                uses: dorny/test-reporter@v1
                with:
                    name: Unit Test Results
                    path: '**/TestResults/*.trx'
                    reporter: dotnet-trx

    # Back-End Integration Tests
    Back-End-Integration-Tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                integration_test_project:
                    - tests/IntegrationTests/IntegrationTests/IntegrationTests.csproj
                    # Add more if needed
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Dotnet Setup
                uses: ./.github/workflows/steps/dotnet-setup/
                with:
                    project-path: ${{ matrix.integration_test_project }}

            -   name: Run Integration Tests
                run: dotnet test ${{ matrix.integration_test_project }} --no-build --verbosity normal --parallel none

    # Ensure the Docker image can be built without errors
    Test-Docker-Build:
        needs: [ Front-End-Type-Check, Front-End-Eslint-Check, Front-End-Unit-Tests, Front-End-Integration-Tests, Back-End-Unit-Tests, Back-End-Integration-Tests ]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Source Code
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build
                uses: docker/build-push-action@v6
                env:
                    VERSION: 0.0.0
                    INFORMATIONAL_VERSION: 0.0.0
                with:
                    platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
                    push: false
                    build-args: |
                        VERSION=0.0.0
                        INFORMATIONAL_VERSION=0.0.0
                    file: docker/Dockerfile

